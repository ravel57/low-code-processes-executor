plugins {
	id 'java'
	id 'application'
	id 'org.jetbrains.kotlin.jvm' version '1.9.23'
	id 'org.openjfx.javafxplugin' version '0.0.13'
	id 'org.javamodularity.moduleplugin' version '1.8.12'
}

group = 'ru.ravel'
version = '1.0-SNAPSHOT'

repositories {
	mavenCentral()
}

javafx {
	version = '21.0.2'
	modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
	implementation 'org.openjfx:javafx-controls:21.0.2'
	implementation 'org.openjfx:javafx-fxml:21.0.2'
	implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.23'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.15.2'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'
	implementation 'org.apache.groovy:groovy:4.0.26'
	implementation 'org.apache.groovy:groovy-jsr223:4.0.26'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-debug:1.7.3'
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-javafx:1.7.3"
	implementation 'org.yaml:snakeyaml:2.2'
}

application {
	mainClass = 'ru.ravel.testjavafx.HelloApplicationKt'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	modularity.inferModulePath = true
}

tasks.named('compileKotlin', org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
	kotlinOptions.jvmTarget = '21'
	destinationDirectory.set(
			tasks.named('compileJava', JavaCompile).get().destinationDirectory
	)

//	toolchain {
//		languageVersion = JavaLanguageVersion.of(21)
//	}
}
tasks.named('compileTestKotlin', org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
	kotlinOptions.jvmTarget = '21'
	destinationDirectory.set(
			tasks.named('compileTestJava', JavaCompile).get().destinationDirectory
	)
}

jar {
	manifest {
		attributes(
				'Main-Class': 'ru.ravel.testjavafx.MainApp'
		)
	}
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

application {
	mainClass = 'ru.ravel.testjavafx.MainApp'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	kotlinOptions {
		jvmTarget = "21" // или 17 — под вашу Java
	}
}

applicationDefaultJvmArgs = [
		"--add-opens=kotlinx.coroutines.core/kotlinx.coroutines.debug.internal=ALL-UNNAMED",
		"-Dkotlinx.coroutines.debug=on"
]