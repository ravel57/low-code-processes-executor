plugins {
	id 'org.jetbrains.kotlin.jvm'
	id 'application'
	id 'org.openjfx.javafxplugin'
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(17) }
	modularity.inferModulePath = false
}

javafx {
	version = '21.0.5'
	modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
	implementation project(':core')
	implementation 'org.openjfx:javafx-controls:21.0.2'
	implementation 'org.openjfx:javafx-fxml:21.0.2'
	implementation 'org.openjfx:javafx-web:21.0.2'
	implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.23'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.15.2'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'

	implementation 'org.apache.groovy:groovy:4.0.26'
	implementation 'org.apache.groovy:groovy-jsr223:4.0.26'
	implementation 'org.apache.groovy:groovy-json:4.0.23'
	implementation 'org.apache.groovy:groovy-xml:4.0.23'
	implementation 'org.apache.groovy:groovy-sql:4.0.23'
	implementation 'org.postgresql:postgresql:42.7.7'
	implementation "org.graalvm.js:js:24.2.1"
	runtimeOnly 'org.graalvm.js:js-scriptengine:24.2.1'
	implementation 'org.graalvm.polyglot:polyglot:24.2.1'
	implementation 'org.graalvm.polyglot:js:24.2.1'

	implementation 'org.openjdk.nashorn:nashorn-core:15.4'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-debug:1.7.3'
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-javafx:1.7.3"
	implementation 'org.yaml:snakeyaml:2.2'
	implementation 'org.fxmisc.richtext:richtextfx:0.10.9'
}

application {
	mainClass = "ru.ravel.lcpedesktop.MainApp"
}
